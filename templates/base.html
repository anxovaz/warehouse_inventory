<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Warehouse Inventory{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('inventory.index') }}">Warehouse <span>Inventory</span></a>
      <nav><a href="{{ url_for('inventory.index') }}">Products</a></nav>
    </header>
    <main class="page-shell">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="alerts" aria-live="polite">
            {% for category, message in messages %}
              <p class="alert alert-{{ category }}">{{ message }}</p>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">Warehouse inventory management</footer>
  </body>
</html>
